networks:
  app-tier:
    driver: bridge
  data-tier:
    driver: bridge

services:
  # -----------------------------------------------
  # PostgreSQL: User Profile Domain Data
  # -----------------------------------------------
  db-profile:
    image: postgres:15-alpine
    container_name: db-profile
    environment:
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_password
      POSTGRES_DB: profile_db
    networks:
      - data-tier
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M

  # -----------------------------------------------
  # PostgreSQL: Payment Domain Data
  # -----------------------------------------------
  db-payment:
    image: postgres:15-alpine
    container_name: db-payment
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: payment_db
    networks:
      - data-tier
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 256M

  # -----------------------------------------------
  # Redis: Caching and Rate Limiting
  # -----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - data-tier
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M

  # -----------------------------------------------
  # HashiCorp Vault: SPII Cryptography
  # -----------------------------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: vault-spii
    # Vault starts in sealed mode by default (returns sys 2)
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    networks:
      - data-tier
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    deploy:
      resources:
        limits:
          memory: 128M

  # -----------------------------------------------
  # Apache Kafka (KRaft mode)
  # -----------------------------------------------
  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka-broker
    environment:      
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Setup internal and external routing
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9094,EXTERNAL://localhost:9092"      
      
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"            
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Required by apache/kafka images to successfully bind and accept traffic
      CLUSTER_ID: "sfzXsrFaTtmAdrC5Ge6fzg"

      # Required settings for single-node development environments
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - data-tier
    ports:
      - "9092:9092"
    deploy:
      resources:
        limits:
          memory: 512M

  # -----------------------------------------------
  # MinIO: S3 Compatible Storage for Batch Files
  # -----------------------------------------------
  minio:
    image: minio/minio
    container_name: minio-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password"
    networks:
      - data-tier
    ports:
      - "9000:9000"
      - "9001:9001"
    deploy:
      resources:
        limits:
          memory: 256M

